{{ define "layout.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drayage Quoter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" defer></script>
</head>
<body>
{{ if .User }}
<nav class="app-nav">
    <a href="/" class="app-nav-brand">Drayage Quoter</a>
    <a href="/">Lanes</a>
    <a href="/carriers">Carriers</a>
    <a href="/settings">Settings</a>
    <div class="app-nav-right">
        <span>{{ .User.Name }}</span>
        {{ if .User.IsAdmin }}
        <a href="/admin/users">Admin</a>
        {{ end }}
        <form method="POST" action="/logout">
            <button type="submit">Log out</button>
        </form>
    </div>
</nav>
<div class="app-content">
    {{ template "content" . }}
</div>
{{ else }}
<div class="auth-content">
    {{ template "content" . }}
</div>
{{ end }}
<script>
  // Reformat all <time datetime="..."> elements into "March 11, 2026 2:30pm" in the user's local timezone.
  // root defaults to document; pass a narrower element after HTMX swaps.
  function fmtTimes(root) {
    var months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
    (root || document).querySelectorAll('time[datetime]').forEach(function (el) {
      var d = new Date(el.getAttribute('datetime'));
      if (isNaN(d.getTime())) return;
      var h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
      var ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      el.textContent = months[d.getMonth()] + ' ' + d.getDate() + ', ' +
                       d.getFullYear() + ' ' + h + ':' + m + ampm;
    });
  }
  document.addEventListener('DOMContentLoaded', function () { fmtTimes(); });
  document.body.addEventListener('htmx:afterSwap', function (e) { fmtTimes(e.detail.elt); });
</script>
</body>
</html>
{{ end }}
