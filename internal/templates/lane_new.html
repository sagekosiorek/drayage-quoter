{{ define "content" }}
<p class="back-link"><a href="/">← Back to lanes</a></p>
<h1 class="page-title">New Lane</h1>

<form method="POST" action="/lanes" class="form-narrow">
    <h2 class="form-section">Customer</h2>

    <input type="hidden" id="customer_id" name="customer_id" value="">

    <label for="customer_name">Customer Name*</label>
    <input type="text" id="customer_name" name="customer_name"
           placeholder="Zorp Corp" required autocomplete="off"
           hx-get="/customers/search"
           hx-trigger="input changed delay:300ms"
           hx-target="#customer-suggestions"
           hx-include="this">
    <div id="customer-suggestions" class="suggestions"></div>

    <label for="lp_number">LP Number* <span class="form-hint">(MasterMind CRM)</span></label>
    <input type="text" id="lp_number" name="lp_number" placeholder="12345" required>

    <h2 class="form-section">Lane Details</h2>

    <label for="origin_port_id">Origin Port / Rail Head*</label>
    <select id="origin_port_id" name="origin_port_id" required>
        <option value="">Select port...</option>
        {{- range .Ports }}
        <option value="{{ .ID }}">{{ .Name }}</option>
        {{- end }}
    </select>

    <label for="destination">Destination*</label>
    <input type="text" id="destination" name="destination" placeholder="City, State or ZIP" required>

    <div class="form-cols">
        <div>
            <label for="container_size">Container Size</label>
            <select id="container_size" name="container_size">
                <option value="20_40" selected>20' / 40'</option>
                <option value="20">20'</option>
                <option value="40">40'</option>
                <option value="40HC">40' High Cube</option>
                <option value="Flat Rack">Flat Rack</option>
            </select>
        </div>
        <div>
            <label for="weight">Weight (lbs)</label>
            <input type="number" id="weight" name="weight" placeholder="Optional" min="0">
        </div>
    </div>

    <div class="form-cols">
        <div>
            <label for="direction">Direction</label>
            <select id="direction" name="direction">
                <option value="import" selected>Import</option>
                <option value="export">Export</option>
            </select>
        </div>
        <div>
            <label for="load_type">Load Type</label>
            <select id="load_type" name="load_type">
                <option value="live" selected>Live</option>
                <option value="drop_pick">Drop / Pick</option>
            </select>
        </div>
    </div>

    <label for="commodity">Commodity</label>
    <input type="text" id="commodity" name="commodity" placeholder="Optional">

    <fieldset>
        <legend>Special Requirements</legend>
        <label><input type="checkbox" name="hazmat" value="1"> Hazmat</label>
        <label><input type="checkbox" name="overweight" value="1"> Overweight</label>
        <label><input type="checkbox" name="out_of_gauge" value="1"> Out of Gauge</label>
    </fieldset>

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="3" placeholder="Optional lane notes"></textarea>

    <span class="form-hint">Required fields*</span>

    <div class="form-actions">
        <button class="primary" type="submit">Save Draft</button>
        <a href="/">Cancel</a>
    </div>
</form>

<script>
function selectCustomer(el) {
    document.getElementById('customer_id').value = el.dataset.id;
    document.getElementById('customer_name').value = el.dataset.name;
    document.getElementById('lp_number').value = el.dataset.lp;
    document.getElementById('customer-suggestions').innerHTML = '';
}
</script>
{{ end }}
