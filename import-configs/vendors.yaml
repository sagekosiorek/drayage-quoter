# Imports carriers, their port assignments, and contacts from a single flat file.
#
# Expected CSV/Excel headers:
#   Carrier Name, Port Name, Contact Name, Contact Email
#
# Multiple contacts per port: repeat the carrier+port columns on each row.
# Example:
#   Carrier Name,Port Name,Contact Name,Contact Email
#   Pacific Coast Drayage,Los Angeles,John Smith,john@pcd.com
#   Pacific Coast Drayage,Los Angeles,Jane Doe,jane@pcd.com   ← second contact, same port
#   Pacific Coast Drayage,Seattle,Bob Lee,bob@pcd.com
#   Harbor Logistics,Houston,Alice Wu,alice@hl.com

tables:
  - name: carriers
    dedup_key: name          # skip if a carrier with this name already exists
    columns:
      name: Carrier Name

  - name: carrier_ports
    parent: carriers
    parent_fk: carrier_id
    dedup_key: [carrier_id, port_id]    # skip if this carrier+port pair already exists
    cache_key: [Carrier Name, Port Name] # CSV headers that children use to look up this row
    foreign_keys:
      port_id:               # resolve port_id by matching ports.name
        table: ports
        match: name
        csv: Port Name

  - name: carrier_contacts
    parent: carrier_ports
    parent_fk: carrier_ports_id
    dedup_key: email  # skip if a carrier contact already exists
    columns:
      name: Contact Name
      email: Contact Email
