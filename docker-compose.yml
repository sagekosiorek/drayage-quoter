services:
  app:
    build: .
    # Skip Litestream entrypoint for local dev; run app directly against bind-mounted ./data.
    entrypoint: ["/drayage-quoter"]
    ports:
      - "8080:8080"
    # .env variables are set in fly secrets
    environment:
      DB_PATH: /data/drayage.db
      BASE_URL: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM}
      MAILGUN_WEBHOOK_SIGNING_KEY: ${MAILGUN_WEBHOOK_SIGNING_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
    volumes:
      - ./data:/data
    depends_on:
      - minio

  # MinIO provides S3-compatible storage for Litestream backup testing.
  # Console: http://localhost:9001  (minioadmin / minioadmin)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  minio-data:
